name: MySQL Database Workflow

on:
  push:
    branches: [ main ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    # Déclaration du service MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ma_base_de_donnees
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

     
      # 2. Décompression et installation du client MySQL
      - name: Install MySQL Client & Unzip DB
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          unzip sql/sfy810-20260731.sql.zip -d sql/

      # 3. Test de connexion et création de tables
      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/sfy810-20260731.sql

      # 4. Exécuter vos scripts SQL et vérifications
      - name: Run SQL Scripts & Tests
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees -e "show tables;" > index.html
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/comptes.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/actifs.sql
          echo "La base de données est prête et opérationnelle !"


          - run: ls

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # (Optionnel : Ajoutez ici vos étapes d'installation et de build de votre framework ex: npm install && npm run build)

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Indiquez le dossier qui contient vos fichiers statiques prêts pour le web (ex: "dist", "build", ".")
          path: "." 

  # Étape 2 : Publication de l'artefact sur GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    
