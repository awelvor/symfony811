name: MySQL Database Workflow

on:
  push:
    branches: [ main ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest

    # Déclaration du service MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ma_base_de_donnees
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.bis Installer PHP (Indispensable pour Symfony / Composer / PHPUnit)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Adaptez selon la version requise par votre projet Symfony (ex: 8.2 ou 8.3)
          extensions: mbstring, xml, ctype, iconv, pdo_mysql

      # 2. Décompression et installation du client MySQL
      - name: Install MySQL Client & Unzip DB
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          unzip sql/sfy810-20260731.sql.zip -d sql/

      # 3. Test de connexion et création de tables
      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/sfy810-20260731.sql

      # 4. Exécuter vos scripts SQL et vérifications
      - name: Run SQL Scripts & Tests
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees -e "show tables;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/comptes.sql
          mysql -h 127.0.0.1 -P 3306 -u root -proot_password ma_base_de_donnees < sql/actifs.sql
          echo "La base de données est prête et opérationnelle !"

      # 5. Dépendances Symfony et PHPUnit
      - name: Install Dependencies & Run PHPUnit
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev symfony/test-pack
          php bin/phpunit
